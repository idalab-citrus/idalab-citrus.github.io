<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 青色圓角方塊 + 白色橘子橫切面線稿 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#g)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <!-- 果皮外圈 -->
    <circle cx="16" cy="16" r="10" stroke-width="2"/>
    <!-- 果肉內圈 -->
    <circle cx="16" cy="16" r="7.3" stroke-width="1.4"/>
    <!-- 8 瓣分隔線 -->
    <g stroke-width="1.3">
      <line x1="16" y1="16" x2="16" y2="8.7"/>
      <line x1="16" y1="16" x2="16" y2="8.7" transform="rotate(45 16 16)"/>
      <line x1="16" y1="16" x2="16" y2="8.7" transform="rotate(90 16 16)"/>
      <line x1="16" y1="16" x2="16" y2="8.7" transform="rotate(135 16 16)"/>
      <line x1="16" y1="16" x2="16" y2="8.7" transform="rotate(180 16 16)"/>
      <line x1="16" y1="16" x2="16" y2="8.7" transform="rotate(225 16 16)"/>
      <line x1="16" y1="16" x2="16" y2="8.7" transform="rotate(270 16 16)"/>
      <line x1="16" y1="16" x2="16" y2="8.7" transform="rotate(315 16 16)"/>
    </g>
  </g>
  <!-- 中心 -->
  <circle cx="16" cy="16" r="1.6" fill="#ffffff"/>
</svg>
